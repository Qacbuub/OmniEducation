# Production-style deployment: PostgreSQL + Django/Gunicorn + Nginx (serving React).
#   cp .env.prod.example .env.prod   (then edit the secrets)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Open http://localhost  (or your server's address).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omniedu}
      POSTGRES_USER: ${POSTGRES_USER:-omniedu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-omniedu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-omniedu}
      MEDIA_ROOT: /app/media
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    expose:
      - "8000"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx:/etc/nginx/conf.d:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
      # - ./deploy/certs:/etc/nginx/certs:ro     # for HTTPS (see docs/deployment.md)

volumes:
  pgdata:
  media:
  static:
