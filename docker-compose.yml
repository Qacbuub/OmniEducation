# Local PostgreSQL for development:  docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: omniedu
      POSTGRES_USER: omniedu
      POSTGRES_PASSWORD: omniedu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
