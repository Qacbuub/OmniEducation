# OmniEducation – Nginx in front of the React build and the Django API (Gunicorn).
#   /            React single-page app (built files)
#   /api/        Django REST API            -> backend:8000
#   /admin/      Django admin               -> backend:8000
#   /static/     Django admin/API-docs CSS   (collectstatic volume)
#   /media/tenant-logos/  public institution logos only.
# Student photos and documents are NOT served from /media: they are only downloadable through
# the API, which checks who is asking.

upstream omniedu_api {
    server backend:8000;
}

# Rate limit for the sign-in endpoint (the API also throttles it).
limit_req_zone $binary_remote_addr zone=omniedu_login:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # ---- HTTPS: when you have a certificate, uncomment the redirect below and the 443 server further down.
    # return 301 https://$host$request_uri;

    include /etc/nginx/conf.d/omniedu-app.inc;
}

